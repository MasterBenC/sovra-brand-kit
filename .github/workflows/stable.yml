name: stable
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r skills/sovra-brand/requirements.txt
      - run: python skills/sovra-brand/tests/test_stable.py
